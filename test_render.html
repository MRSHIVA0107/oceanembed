<!DOCTYPE html>

<title>Test Math</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; }
  .formula { background: #f0f4f8; padding: 15px; border-left: 4px solid #0284c7; font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 18px; }
</style>

<body>
  <h1>Mathematical Test</h1>
  <div class="formula">
    T̂(x, y, z<sub>k</sub>, t) = T̄<sub>clim</sub>(x, y, z<sub>k</sub>, m) + [ΔT̂<sub>norm</sub>(x, y, z<sub>k</sub>, t) · σ<sub>train</sub>(z<sub>k</sub>)]
  </div>
</body>
